<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethereum EIP-6963</title>
    <script src="../../bundle.js"></script>
    <script src="../../scripts/ethereum/eip6963_eth.mjs" type="module"></script>
    <link rel="icon" type="image/x-icon" href="../../statics/favicon.ico"/>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        #wallet-list {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #f9f9f9;
        }
        .wallet-item {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            margin: 8px 0;
            border: 2px solid #ddd;
            border-radius: 6px;
            background-color: white;
            cursor: pointer;
            transition: all 0.2s;
        }
        .wallet-item:hover {
            border-color: #007bff;
            background-color: #f0f8ff;
        }
        .wallet-item.selected {
            border-color: #28a745;
            background-color: #d4edda;
        }
        .wallet-item img {
            border-radius: 4px;
        }
        #wallet-status {
            padding: 15px;
            margin: 20px 0;
            border: 1px solid #ddd;
            border-radius: 8px;
            background-color: #e9ecef;
            min-height: 40px;
        }
        button {
            margin: 5px 0;
            padding: 10px 15px;
            border-radius: 4px;
            border: 1px solid #ccc;
            background-color: #007bff;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .discover-btn {
            background-color: #28a745;
            font-weight: bold;
            font-size: 16px;
            padding: 12px 20px;
        }
        .discover-btn:hover {
            background-color: #218838;
        }
        h2 {
            color: #333;
            border-bottom: 2px solid #007bff;
            padding-bottom: 10px;
        }
    </style>
</head>

<body>
    <h2>EIP-6963 钱包连接演示</h2>

    <!-- 钱包列表容器 -->
    <div id="wallet-list">
        <h3>可用钱包:</h3>
        <p>点击下方按钮发现钱包</p>
    </div>

    <!-- 连接状态显示 -->
    <div id="wallet-status">
        未连接
    </div>

    <!-- 操作按钮 -->
    <button class="discover-btn" onclick="onChainDapp.ethereum.discoverWallets()">🔍 Discover Wallets</button><br><br>
    <button onclick="onChainDapp.ethereum.connect()">Connect</button><br><br>
    <button onclick="onChainDapp.ethereum.requestAccount()">Request Accounts</button><br><br>
    <button onclick="onChainDapp.ethereum.personalSign()">Personal Sign</button><br><br>
    <button onclick="onChainDapp.ethereum.ethSign()">Eth Sign</button><br><br>
    <button onclick="onChainDapp.ethereum.signTypedDataV1()">Sign TypedData V1</button><br><br>
    <button onclick="onChainDapp.ethereum.signTypedDataV4()">Sign TypedData V4</button><br><br>
    <button onclick="onChainDapp.ethereum.importNewEthereumChain()">Import Chain</button><br><br>
    <button onclick="onChainDapp.ethereum.sendTransaction()">Send Transaction</button><br><br>
    <button onclick="onChainDapp.ethereum.listenOnChainChanged()">Listen on chain changed</button><br><br>
    <button onclick="onChainDapp.ethereum.listenOnAccountChanged()">listen on account changed</button><br><br>
    <button onclick="onChainDapp.ethereum.listeonOnMessage()">listen on message</button><br><br>
    <button onclick="onChainDapp.ethereum.subscribe()">Subscribe</button><br><br>
    <button onclick="onChainDapp.ethereum.getBalance()">Get Balance</button><br><br>
    <button onclick="onChainDapp.ethereum.disconnect()">Disconnect</button><br><br>
</body>

</html>
